version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: kinetics-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.6.1
    container_name: kinetics-keycloak
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    command: start-dev --import-realm
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak-config:/opt/keycloak/data/import

  seaweedfs-master:
    image: chrislusf/seaweedfs
    container_name: kinetics-seaweed-master
    command: master -ip=seaweedfs-master -port=9333
    ports:
      - "9333:9333"

  seaweedfs-volume:
    image: chrislusf/seaweedfs
    container_name: kinetics-seaweed-volume
    command: volume -mserver=seaweedfs-master:9333 -port=8080
    ports:
      - "8082:8080"
    depends_on:
      - seaweedfs-master

volumes:
  postgres-data: