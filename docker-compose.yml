
services:

  # ------------------------------------
  # Postgres
  # ------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: kinetics-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # ------------------------------------
  # Keycloak
  # ------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:26.6.1
    container_name: kinetics-keycloak
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    command: start-dev --import-realm
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak-config:/opt/keycloak/data/import

  # ------------------------------------
  # SeaweedFS
  # ------------------------------------
  seaweedfs-master:
    image: chrislusf/seaweedfs:4.44
    container_name: kinetics-seaweed-master
    command: master -ip=seaweedfs-master -port=9333
    ports:
      - "9333:9333"

  seaweedfs-volume:
    image: chrislusf/seaweedfs:4.44
    container_name: kinetics-seaweed-volume
    command: volume -mserver=seaweedfs-master:9333 -port=8080
    ports:
      - "8082:8080"
    depends_on:
      - seaweedfs-master

  seaweedfs-filer:
    image: chrislusf/seaweedfs:4.44
    container_name: kinetics-seaweed-filer
    command: filer -master=seaweedfs-master:9333
    ports:
      - "8888:8888"
    depends_on:
      - seaweedfs-master
      - seaweedfs-volume

  seaweedfs-s3:
    image: chrislusf/seaweedfs:4.44
    container_name: kinetics-seaweed-s3
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo '{"identities":[{"name":"spring-backend","credentials":[{"accessKey":"${SEAWEEDFS_ACCESS_KEY}","secretKey":"${SEAWEEDFS_SECRET_KEY}"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' > /tmp/s3.json
        weed s3 -filer=seaweedfs-filer:8888 -port=8333 -config=/tmp/s3.json
    ports:
      - "8333:8333"
    depends_on:
      - seaweedfs-filer

  # ------------------------------------
  # Springboot Backend
  # ------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kinetics-backend
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=${DB_HOST}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - SEAWEEDFS_ENDPOINT=${SEAWEEDFS_ENDPOINT}
      - SEAWEEDFS_ACCESS_KEY=${SEAWEEDFS_ACCESS_KEY}
      - SEAWEEDFS_SECRET_KEY=${SEAWEEDFS_SECRET_KEY}
      - REACTUR_API_BASE_URL=${REACTUR_API_BASE_URL}
      - SPRING_PROFILES_ACTIVE=dev
    depends_on:
      - postgres
      - keycloak
      - seaweedfs-s3

  # ------------------------------------
  # Angular Frontend
  # ------------------------------------
  frontend:
    build:
      context: ./frontend-ang
      dockerfile: Dockerfile
    container_name: kinetics-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  postgres-data: