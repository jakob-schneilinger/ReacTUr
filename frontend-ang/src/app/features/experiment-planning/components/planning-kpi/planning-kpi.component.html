<div class="row">
  <div class="col-md-6 mb-3">
    <div class="card shadow-sm border-start border-warning border-4">
      <div class="card-body">
        <h6 class="text-muted mb-1">{{ 'planning.halfLife' | transloco }}</h6>
        <h3 class="mb-0">{{ halfLifeTime || '-' }}</h3>
      </div>
    </div>
  </div>
  <div class="col-md-6 mb-3">
    <div class="card shadow-sm border-start border-success border-4">
      <div class="card-body">
        <h6 class="text-muted mb-1">{{ 'planning.reactionEnd' | transloco }}</h6>
        <h3 class="mb-0">{{ completionTime || '-' }}</h3>
      </div>
    </div>
  </div>
</div>
