<div class="layout-wrapper">
  <div class="container-fluid">
    <div class="row mb-3">
      <div class="col-12">
        <h2>{{ 'planning.title' | transloco }}</h2>
        <p class="text-muted">{{ 'planning.subtitle' | transloco }}</p>
      </div>
    </div>

    <div class="row">
      <div class="col-md-3">
        <app-planning-sidebar
          [kValue]="initialKValue"
          [nameA]="nameA"
          [nameB]="nameB"
          (simulate)="onSimulate($event)">
        </app-planning-sidebar>
      </div>

      <div class="col-md-9">
        <div class="row mb-4">
          <div class="col-12">
            <app-planning-kpi
              [halfLifeTime]="halfLifeTime"
              [completionTime]="completionTime">
            </app-planning-kpi>
          </div>
        </div>

        <div class="row">
          <div class="col-12">
            <div class="card shadow-sm">
              <div class="card-body">
                <app-planning-chart
                  [data]="chartData"
                  [unit]="selectedUnit"
                  [nameA]="nameA"
                  [nameB]="nameB">
                </app-planning-chart>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
