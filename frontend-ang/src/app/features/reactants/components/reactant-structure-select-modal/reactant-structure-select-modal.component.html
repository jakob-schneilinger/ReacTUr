<app-modal
  [isOpen]="true"
  [title]="'reactants.details.modals.structureSelect.title' | transloco"
  size="xl"
  (close)="close.emit()">

  <div body class="container-fluid">

    <div class="row text-center mb-4">
      <p class="text-muted" [innerHTML]="'reactants.details.modals.structureSelect.description' | transloco">
      </p>
    </div>

    <div class="row justify-content-center">
      @for (struct of pendingStructures; track struct.id) {
        <div class="col-md-6 d-flex flex-column align-items-center">

          <div class="border rounded p-3 mb-3 w-100" style="min-height: 300px;">
            @if (structureService.parseFile(struct, "placeholder"); as file) {
              <app-reactant-structure
                [structure]="file"
                [smiles]="baseSmiles"
                [show3D]="true">
              </app-reactant-structure>
            }
          </div>

          <button type="button" class="primary" (click)="selectStructure(struct)">
            {{ 'reactants.details.modals.structureSelect.buttons.select' | transloco }}
          </button>

        </div>
      }
    </div>
  </div>

  <ng-container footer>

    <button type="button" class="error" (click)="rejectStructures()">
      {{ 'reactants.details.modals.structureSelect.buttons.rejectAll' | transloco }}
    </button>

    <button type="button" class="" (click)="close.emit()">
      {{ 'reactants.details.modals.structureSelect.buttons.cancel' | transloco }}
    </button>

  </ng-container>

</app-modal>
