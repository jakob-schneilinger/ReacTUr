<app-modal
  [isOpen]="true"
  [title]="'reactants.structureSelectionModal.title' | transloco"
  size="xl"
  (close)="close.emit()">

  <div body class="container-fluid py-3">

    <div class="row text-center mb-4">
      <p class="text-muted">
        {{ 'reactants.structureSelectionModal.description' | transloco }}
      </p>
    </div>

    <div class="row justify-content-center">
      @for (struct of pendingStructures; track struct.id) {
        <div class="col-md-6 mb-4 d-flex flex-column align-items-center">

          <h6 class="text-primary mb-3">{{ struct.name }}</h6>

          <div class="border rounded p-3 mb-3 w-100" style="min-height: 300px;">
            @if (structureService.parseFile(struct); as file) {
              <app-reactant-structure
                [structure]="file"
                [smiles]="baseSmiles"
                [show3D]="true">
              </app-reactant-structure>
            }
          </div>

          <button type="button" class="btn btn-primary primary" (click)="selectStructure(struct)">
            {{ 'reactants.structureSelectionModal.buttons.select' | transloco }}
          </button>

        </div>
      }
    </div>
  </div>

  <ng-container footer>

    <button type="button" class="btn btn-danger btn-outline-danger me-auto" (click)="rejectStructures()">
      {{ 'reactants.structureSelectionModal.buttons.rejectAll' | transloco }}
    </button>

    <button type="button" class="btn btn-secondary" (click)="close.emit()">
      {{ 'reactants.structureSelectionModal.buttons.cancel' | transloco }}
    </button>

  </ng-container>

</app-modal>
