<div class="custom-search-wrapper input-group search-group">
  <span class="input-group-text bg-white border-end-0">
    <i class="bi bi-search text-muted"></i>
  </span>
  <input
    type="text"
    class="form-control border-start-0 ps-0"
    [placeholder]="placeholder"
    [(ngModel)]="searchTerm"
    (input)="onInput()"
  >

  @if (showDrawButton) {
    <button
      class="primary-plain icon-btn"
      type="button"
      (click)="onOpenDraw()"
      title="Draw Molecule">
      <i class="bi bi-pencil-square"></i>
    </button>
  }

  @if (searchTerm) {
    <button
      class="icon-btn text-danger clear-btn"
      type="button"
      (click)="onClear()"
      title="Clear Search">
      <i class="bi bi-x-lg"></i>
    </button>
  }
</div>
