<app-modal
  [isOpen]="true"
  [title]="'Metadata Detected'"
  size="lg"
  (close)="onCancel()">

  <p>We found the following details in your uploaded file <strong>{{ fileName }}</strong>. Select the data you would like to autofill.</p>

  <div class="modal-content">

    @if (displayData.length > 0) {
      <div class="table-container">
        <table class="metadata-table">
          <thead>
          <tr>
            <th class="checkbox-col">Keep</th>
            <th>Property</th>
            <th>Value</th>
          </tr>
          </thead>
          <tbody>
            @for (item of displayData; track item.key) {
              <tr (click)="toggleSelection(item)" [class.unselected]="!item.selected">
                <td class="checkbox-col">
                  <input type="checkbox"
                         [checked]="item.selected"
                         (click)="$event.stopPropagation()"
                         (change)="toggleSelection(item)">
                </td>
                <td class="metadata-key">{{ metadataLabels[item.key] || item.key }}</td>
                <td class="metadata-value">{{ item.value }}</td>
              </tr>
            }
          </tbody>
        </table>
      </div>
    }
  </div>

  <ng-container footer>
    <button type="button" class="primary" (click)="onConfirm()">Use Selected Metadata</button>
    <button type="button" class="" (click)="onCancel()">Cancel</button>
  </ng-container>
</app-modal>
