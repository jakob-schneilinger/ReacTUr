<div class="layout-wrapper">

  <div class="p-4 w-100">

    <div class="header-section d-flex justify-content-between align-items-center mb-4">
      <h2>{{ 'experiments.my.title' | transloco }}</h2>

      <div class="btn-group shadow-sm" role="group">
        <button type="button" class=""
                [class.primary]="viewMode === 'active'"
                [class.primary-plain]="viewMode !== 'active'"
                (click)="toggleViewMode('active')">
          <i class="bi bi-journal-text me-1"></i> {{ 'experiments.my.active' | transloco }}
        </button>
        <button type="button" class=""
                [class.primary]="viewMode === 'archived'"
                [class.primary-plain]="viewMode !== 'archived'"
                (click)="toggleViewMode('archived')">
          <i class="bi bi-archive me-1"></i> {{ 'experiments.my.archived' | transloco }}
        </button>
      </div>
    </div>

    @if (isLoading) {
      <div class="loading-state text-center mt-5">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="mt-2 text-muted">{{ 'experiments.my.loading' | transloco }}...</p>
      </div>
    } @else {

    @if (experiments.length > 0) {

      <div class="experiments-layout">

        <app-search-results
          class="experiment-column"
          state="has-results"
          [disableExport]="true"
          [showPages]="false"
          [allowArchive]="viewMode === 'active'"
          [experiments]="leftHalf"
          [totalElements]="leftHalf.length"
          [pageSize]="leftHalf.length || 1"
          (listChanged)="onListChanged()">
        </app-search-results>

        <app-search-results
          class="experiment-column"
          state="has-results"
          [disableExport]="true"
          [showPages]="false"
          [allowArchive]="viewMode === 'active'"
          [experiments]="rightHalf"
          [totalElements]="rightHalf.length"
          [pageSize]="rightHalf.length || 1"
          (listChanged)="onListChanged()">
        </app-search-results>

      </div>

    } @else {
      <div class="empty-state text-center text-muted mt-5 grid-full-width">
        <i class="bi bi-inbox fs-1"></i>
        <p class="mt-3 fw-semibold">
          {{ viewMode === 'active'
          ? ('experiments.my.noActive' | transloco)
          : ('experiments.my.noArchived' | transloco) }}
        </p>
      </div>
    }

  }
  </div>
</div>
