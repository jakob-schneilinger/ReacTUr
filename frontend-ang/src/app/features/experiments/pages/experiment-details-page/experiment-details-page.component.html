
<div class="layout-wrapper">
  <app-layout>

    <!-- Linke Spalte -->
    <div leftContent>
      <h2>{{experimentTitle}}</h2>

      @if (experiment) {
        <button (click)="openHistoryModal()">
          <i class="bi bi-clock-history"></i> {{ 'experiments.details.showHistory' | transloco }}
        </button>
      }

      @if (formState === 'create' || experiment) {
        <app-experiment-details-form
          class="experiment-details-form"
          [formState]="formState"
          [experiment]="experiment"
          (saveExperiment)="onSaveExperiment($event)">
        </app-experiment-details-form>
      } @else {
        <div class="loading-state">
          <p>{{ 'experiments.details.loading' | transloco }}</p>
        </div>
      }
    </div>

    <!-- Rechte Spalte -->
    <div rightContent>
      @if (filesDirty) {
        <span class="p-3">{{ 'experiments.details.filesDirtyHint' | transloco }}</span>
      }
      <app-file-upload
        [existingFiles]="fakeFiles"
        [allowedExtensions]="['txt', 'csv', 'dsx', 'prism', 'pzfx']"
        [maxFileSizeMB]="10"
        (filesChanged)="onFilesUploaded($event)">
      </app-file-upload>
    </div>

  </app-layout>
</div>

@if (isConfirmMetadataModalOpen) {
  <app-extracted-metadata-confirm-modal
    [fileName]="pendingFileName"
    [metadata]="pendingMetadata"
    (confirm)="confirmMetadataUse($event)"
    (cancel)="declineMetadataUse()">
  </app-extracted-metadata-confirm-modal>
}

<app-experiment-history-modal
  [isOpen]="isHistoryModalOpen"
  [history]="experimentAuditLogs"
  (close)="isHistoryModalOpen = false">
</app-experiment-history-modal>
