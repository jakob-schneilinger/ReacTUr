<div class="unauthorized-wrapper">
  <div class="status-card">
    <div class="icon-placeholder">
    </div>

    <h1>Account Pending</h1>
    <p>
      Welcome! You have successfully logged in, but your account is currently awaiting administrator approval.
    </p>
    <p>
      Once an admin grants you the necessary permissions, you will be able to access the application.
    </p>

    <div class="button-group">
      <button class="primary" (click)="checkStatus()">Check Status</button>
      <button class="plain" (click)="logout()">Log Out</button>
    </div>
  </div>
</div>
