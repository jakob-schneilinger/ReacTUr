<div class="">
  <label class="form-label text-muted fw-bold mb-1">{{ label }}</label>

  @if (!selectedReactant) {
    <div class="position-relative">

      <div class="custom-search-wrapper d-flex align-items-center bg-white shadow-sm">
        <input
          type="text"
          class="form-control border-0 shadow-none bg-transparent"
          [(ngModel)]="searchTerm"
          (ngModelChange)="onSearchInput()"
          placeholder="Search by name, SMILES, or type..." />

        <button
          class="icon-btn text-secondary"
          type="button"
          (click)="openDraw()"
          title="Draw Molecule">
          <i class="bi bi-pencil-square"></i>
        </button>

        @if (searchTerm) {
          <button
            class="icon-btn text-danger me-1"
            type="button"
            (click)="clearReactant()"
            title="Clear Search">
            <i class="bi bi-x-lg"></i>
          </button>
        }
      </div>

      @if (suggestions.length > 0) {
        <div class="list-group position-absolute w-100 mt-1 custom-dropdown-menu">
          @for (item of suggestions; track item.shortName) {
            <button type="button" class="list-group-item custom-dropdown-item border-0" (click)="selectReactant(item)">
              <div class="d-flex w-100 justify-content-between align-items-center mb-1">
                <span class="reactant-name">{{ item.shortName }}</span>
                <span class="badge bg-secondary reactant-type">{{ item.chemicalType.name }}</span>
              </div>
              <span class="reactant-smiles text-break">{{ item.smiles }}</span>
            </button>
          }
        </div>
      }
    </div>
  }
  @else {
    <div class="selected-reactant-card shadow-sm position-relative">
      <div class="d-flex justify-content-between align-items-center">

        <div class="d-flex flex-column">
          <span class="reactant-title text-primary">{{ selectedReactant.shortName }}</span>
          <div class="d-flex align-items-center mt-1 gap-2">
            <span class="badge rounded-pill bg-secondary bg-opacity-75">{{ selectedReactant.chemicalType.name }}</span>
            <span class="text-muted bg-light px-2 rounded selected-smiles text-break">{{ selectedReactant.smiles }}</span>
          </div>
        </div>

        <button type="button" class="btn-close ms-2" aria-label="Close" (click)="clearReactant()" title="Remove"></button>

      </div>
    </div>
  }
</div>

@if (isDrawModalOpen) {
  <app-draw-mol
    [initialSmiles]="currentSmilesForModal"
    (save)="onModalSave($event)"
    (closeModal)="isDrawModalOpen = false">
  </app-draw-mol>
}
