<div class="dropzone p-2 mb-4 rounded text-center" app-drag-and-drop-directive (fileDropped)="onFileDropped($event)">
  <input
    type="file"
    #fileDropRef
    id="fileDropRef"
    multiple
    [accept]="acceptedExtensionsString"
    (change)="fileBrowseHandler($event)"
    class="d-none"
  />

  <div class="drag-and-drop-text-icon">
    <i class="bi bi-file-earmark-text fs-1"></i>
    <h5>Drag and Drop <br> or
      <a href="javascript:void(0)" class="text-primary text-decoration-none" (click)="fileDropRef.click()">Browse</a>
    </h5>
  </div>
  <p class="text-muted small mb-0">
    Supports: {{acceptedExtensionsText}}
    @if (maxFileSizeMB) {
      <span> (Max: {{maxFileSizeMB}}MB</span>
      @if (maxFiles > 0) {
        <span>, {{maxFiles}} {{maxFiles === 1 ? 'file' : 'files'}}</span>
      }
      <span>)</span>
    } @else if (maxFiles > 0) {
      <span> (Max: {{maxFiles}} {{maxFiles === 1 ? 'file' : 'files'}})</span>
    }
  </p>
</div>
