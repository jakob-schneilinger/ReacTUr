
<div class="card mb-2 shadow-sm">
  <div class="card-body py-2 px-3 d-flex justify-content-between align-items-center">
    <div>
      <h6 class="mb-0 text-truncate" style="max-width: 250px;">{{ file?.name }}</h6>
      <small class="text-muted text-uppercase">{{ getExtension(file.name) }}</small>
    </div>
    <div class="d-flex flex-row justify-content-between align-items-center gap-2">
      <div class="icon download-icon" (click)="onDownload()" title="Download">
        <i class="bi bi-download"></i>
      </div>
      <div class="icon remove-icon" (click)="onRemove()" title="Remove">
        <i class="bi bi-trash"></i>
      </div>
    </div>
  </div>
</div>
