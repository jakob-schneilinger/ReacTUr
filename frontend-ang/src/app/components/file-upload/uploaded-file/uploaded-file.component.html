
<div class="card mb-2 shadow-sm">
  <div class="card-body py-2 px-3 d-flex justify-content-between align-items-center">
    <div class="flex-grow-1 overflow-hidden me-3">
      <h6 class="mb-0 text-truncate" style="min-height: 22px">{{ file.name }}</h6>
      <small class="text-muted text-uppercase d-block">{{ getExtension(file.name) }}</small>
    </div>
    <div class="d-flex flex-row align-items-center gap-2 flex-shrink-0">
      <div class="icon download-icon" (click)="onDownload()" title="Download">
        <i class="bi bi-download"></i>
      </div>
      <div *ngIf="removePossible" class="icon remove-icon" (click)="onRemove()" title="Remove">
        <i class="bi bi-trash"></i>
      </div>
    </div>
  </div>
</div>
