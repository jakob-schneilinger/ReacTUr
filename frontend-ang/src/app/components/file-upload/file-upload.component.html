
<div class="container mt-4" style="max-width: 500px;">

  <h6 class="mb-3">Upload your Files:</h6>

  <app-paste-table (fileGenerated)="onPasteTableGenerated($event)">

  </app-paste-table>

  <app-drag-and-drop (filesSelected)="addFiles($event)"></app-drag-and-drop>

  <div class="file-list mt-4">
    <app-uploaded-file
      *ngFor="let file of files; let i = index"
      [file]="file"
      (remove)="confirmRemoveFile(i)">
    </app-uploaded-file>
  </div>
</div>

<!-- Delete Modal -->
<div
  class="modal fade"
  [ngClass]="{'show': isDeleteModalOpen}"
  [style.display]="isDeleteModalOpen ? 'block' : 'none'"
  tabindex="-1"
  style="background-color: rgba(0,0,0,0.5);" >
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content shadow">

      <div class="modal-header border-0 pb-0">
        <h5 class="modal-title text-danger">
          <i class="bi bi-exclamation-triangle-fill me-2"></i> Remove File
        </h5>
        <button type="button" class="btn-close" (click)="cancelDelete()" aria-label="Close"></button>
      </div>

      <div class="modal-body py-4">
        <p class="mb-0">Are you sure you want to remove <strong>{{ pendingFileName }}</strong> from the upload list?</p>
      </div>

      <div class="modal-footer border-0 pt-0">
        <button type="button" class="" (click)="cancelDelete()">Cancel</button>
        <button type="button" class="error" (click)="executeDelete()">Yes, remove it</button>
      </div>

    </div>
  </div>
</div>
