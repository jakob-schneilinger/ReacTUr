
<div class="dropzone p-2 mb-4 rounded text-center" app-drag-and-drop-directive (fileDropped)="onFileDropped($event)" (fileError)="onFileError($event)">
  <input
    type="file"
    #fileDropRef
    id="fileDropRef"
    multiple
    [accept]="acceptedExtensionsString"
    (change)="fileBrowseHandler($event)"
    class="d-none"
  />

  <div class="drag-and-drop-text-icon">
    <i class="bi bi-file-earmark-text fs-1"></i>
    <h5>Drag and Drop <br> or
      <a href="javascript:void(0)" class="text-primary text-decoration-none" (click)="fileDropRef.click()">Browse</a>
    </h5>
  </div>
  <p class="text-muted small mb-0">Supports: {{acceptedExtensionsText}}</p>
</div>
