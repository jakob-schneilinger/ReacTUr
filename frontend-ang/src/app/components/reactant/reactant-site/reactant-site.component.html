<div class="layout-wrapper">

  <div class="row mb-3">
    <div class="col-12">
      <h2 class="mb-0">Reactants</h2>
    </div>
  </div>

  <div class="d-flex justify-content-between align-items-center mb-4">

    <div class="custom-search-wrapper input-group search-group" style="max-width: 500px;">
      <span class="input-group-text bg-white border-end-0">
        <i class="bi bi-search text-muted"></i>
      </span>
      <input
        type="text"
        class="form-control border-start-0 ps-0"
        placeholder="Search by name, SMILES, or type..."
        [(ngModel)]="searchTerm"
        (input)="onSearch()"
      >

      <button
        class="icon-btn text-secondary"
        type="button"
        (click)="openDraw()"
        title="Draw Molecule">
        <i class="bi bi-pencil-square"></i>
      </button>

      @if (searchTerm) {
        <button
          class="icon-btn text-danger"
          type="button"
          (click)="searchTerm = ''; onSearch()"
          title="Clear Search">
          <i class="bi bi-x-lg"></i>
        </button>
      }
    </div>

    <div class="d-flex gap-2">
      <button *appHasRole="['ADMIN']" class="text-nowrap m-0" (click)="showArchivedReactants(!showArchived)">
        {{ showArchived ? 'Show Reactants' : 'Show Archived' }}
      </button>

      <button *appHasRole="['SUPERVISOR','ADMIN']" class="primary text-nowrap m-0" (click)="goToCreate()">
        <i class="bi bi-plus-lg me-1"></i> Add Reactant
      </button>
    </div>

  </div>

  <div class="divider"></div>

  <div class="d-flex flex-column gap-3 mt-4 reactants-container">
    @for (reactant of filteredReactants; track reactant.uuid) {
      <app-reactant-card
        [reactant]="reactant"
        [hasWritePermission]="hasWritePermission"
        [isArchived]="showArchived"
        (view)="viewDetails($event)"
        (edit)="editReactant($event)"
        (archive)="archiveReactant($event)"
        (restore)="restoreReactant($event)"
        (copySmiles)="copyToClipboard($event)">
      </app-reactant-card>
    }
  </div>

  <div class="row" *ngIf="filteredReactants.length === 0">
    <div class="col-12 text-center mt-5">
      <i class="bi bi-inbox text-muted" style="font-size: 3rem;"></i>
      <h4 class="text-muted mt-3">{{ showArchived ? 'No archived reactants found.' : 'No reactants found.'}}</h4>
      <p class="text-muted" *ngIf="searchTerm">Try adjusting your search criteria.</p>
    </div>
  </div>

</div>


<app-confirm-modal
  [isOpen]="isArchiveReactantModalOpen"
  title="Archive Reactant"
  [message]="'Are you sure you want to permanently archive the reactant <strong>' + pendingReactant?.shortName + '</strong>?'"
  confirmLabel="Permanently Archive"
  confirmButtonClass="danger"
  (confirm)="executeArchive()"
  (cancel)="cancelArchive()">
</app-confirm-modal>

@if (isViewModalOpen) {
  <app-reactant-view-modal
    [selectedReactant]="selectedReactantForView"
    [hasWritePermission]="hasWritePermission"
    (close)="closeViewModal()">
  </app-reactant-view-modal>
}

@if (isDrawModalOpen) {
  <app-draw-mol
    [initialSmiles]="currentSmilesForModal"
    (save)="onModalSave($event)"
    (closeModal)="isDrawModalOpen = false">
  </app-draw-mol>
}
