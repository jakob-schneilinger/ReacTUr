
<div class="layout-wrapper">
  <app-layout>

    <!-- Linke Spalte -->
    <div leftContent>
      <h2>{{isEditMode ? reactant?.shortName : "Add new Reactant" }}</h2>
      <app-reactant-details-form [formState]="state" [reactant]="reactant">

      </app-reactant-details-form>
    </div>

    <!-- Rechte Spalte -->
    <div rightContent>
      @for (structure of structures; track $index) {
        <app-reactant-structure [structure]="structure" [smiles]="reactant ? reactant.smiles : '' ">

        </app-reactant-structure>
      }
      <app-file-upload
        [showTable]="false"
        [allowedExtensions]="['xyz']"
        [existingFiles] = structures
        (filesChanged)="handleUploadedFiles($event)" >

      </app-file-upload>
    </div>

  </app-layout>
</div>
