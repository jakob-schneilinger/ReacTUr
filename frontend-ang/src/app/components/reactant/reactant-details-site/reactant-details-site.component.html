
<div class="layout-wrapper">
  <app-layout>

    <!-- Linke Spalte -->
    <div leftContent>
      <h2>{{isEditMode ? reactant?.shortName : "Add new Reactant" }}</h2>
      <app-reactant-details-form [formState]="state" [reactant]="reactant" (smiles)="updateSmiles($event)">

      </app-reactant-details-form>
    </div>

    <!-- Rechte Spalte -->
    <div rightContent>
      @if (loadingStructures || structures.length === 0) {
        <app-reactant-structure
          [loading]="loadingStructures"
          [smiles]="reactant?.smiles || ''">
        </app-reactant-structure>
      } @else {
        @for (structure of structures; track $index) {
          <app-reactant-structure
            [structure]="structure"
            [smiles]="reactant?.smiles || ''">
          </app-reactant-structure>
        }
      }
      <app-file-upload
        [showTable]="false"
        [allowedExtensions]="['xyz']"
        [existingFiles] = structures
        (filesChanged)="handleUploadedFiles($event)" >

      </app-file-upload>
    </div>

  </app-layout>
</div>
