@if (loading) {
  <div class="d-flex flex-column justify-content-center align-items-center py-5" style="min-height: 200px;">
    <span class="text-muted fw-medium">{{ 'reactants.structure.noStructureLoaded' | transloco }}</span>
  </div>
}

<div [class.d-none]="loading">

  @if (structure) {
    <div class="structure-header">
      <button class="toggle-btn primary" (click)="toggleView()">
        {{ 'reactants.structure.switchToView' | transloco: { view: viewMode === '2D' ? '3D' : '2D' } }}
      </button>
    </div>
  }

  <div class="view-wrapper">
    <div class="viewer-container container-2d" [class.active-view]="viewMode === '2D'">
      @if (smiles === "") {
        <p class="text-secondary">{{ 'reactants.structure.addSmiles' | transloco }}</p>
      }
      <div class="rdkit-svg-container" [innerHTML]="svg2D">
      </div>
    </div>

    <div #viewerContainer class="viewer-container container-3d" [class.active-view]="viewMode === '3D'" [class.d-none]="!structure">
    </div>
  </div>

</div>
