<div id="navbar">

  <div id="items">
    <div class="layout"></div>
    <div class="navitem logo" routerLink="/search">
      <img alt="ReacTUr Logo" ngSrc="images/enzyme.png" width="50" height="50" priority>
      <span>ReacTUr</span>
    </div>
    <div class="navitem" routerLink="/search" routerLinkActive="active-link">Search</div>
    <div class="navitem" routerLink="/experiments" routerLinkActive="active-link">Experiments</div>
    <div class="navitem" routerLink="/reactants" routerLinkActive="active-link">Reactants</div>
    <div class="navitem" routerLink="/permissions" routerLinkActive="active-link" [hidden]="user?.role != 'reviewer' && user?.role != 'admin'">Permissions</div>
    <div class="navitem" routerLink="/admin" routerLinkActive="active-link" [hidden]="user?.role != 'admin'">Admin</div>
  </div>

  <div class="profile-container">
    <div ngbDropdown placement="bottom-end" class="d-inline-block">
      <div id="profile" ngbDropdownToggle title="User Profile" class="bi bi-person"></div>

      <div ngbDropdownMenu>
        <!-- logged in -->
        <ng-container *ngIf="isLoggedIn; else loggedOutMenu">
          <button ngbDropdownItem disabled>Hallo, {{ user?.firstName }}</button>
          <div class="dropdown-divider"></div>
          <button ngbDropdownItem (click)="logout()" class="text-danger">
            Logout
            <i id="logout_icon" title="Logout" class="bi bi-box-arrow-right"></i>
          </button>
        </ng-container>

        <!-- not logged in -->
        <ng-template #loggedOutMenu>
          <button ngbDropdownItem routerLink="/login">
            Login
            <i id="login_icon" title="Login" class="bi bi-box-arrow-right"></i>
          </button>
        </ng-template>

      </div>
    </div>
    <div class="layout"></div>
  </div>
</div>
