<div class="container">
  <div class="row">
    <div class="col-md-6 col-lg-4 card align-self-center mx-auto p-4 text-center">

      <h1>{{ 'login.title' | transloco }}</h1>
      <h3 class="mt-3">{{ 'login.login' | transloco }}</h3>

      <p class="mt-2 mb-4 text-muted">
        {{ 'login.loginInstruction' | transloco }}
      </p>

      <button (click)="loginUser()" class="primary w-100" data-cy="login-button">
        {{ 'login.loginButton' | transloco }}
      </button>

    </div>
  </div>
</div>
