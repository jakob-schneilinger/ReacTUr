
<div class="layout-wrapper">
  <app-layout>

    <!-- Linke Spalte -->
    <div leftContent>
      <h2>Experiments</h2>
      <app-experiment-search
        (searchChanged)="handleSearch($event)">
      </app-experiment-search>

      <button class="btn-create"
              [routerLink]="['/experiments/create']"
              [queryParams]="{ reactant1: reactant1 || null, reactant2: reactant2 || null }">
        Create new Experiment
      </button>
    </div>

    <!-- Rechte Spalte -->
    <div rightContent>
      <app-experiment-results
        [state]="currentSearchState"
        [experiments]="foundExperiments">
      </app-experiment-results>
    </div>

  </app-layout>
</div>
