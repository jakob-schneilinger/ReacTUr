<div class="d-flex flex-column gap-4 mb-2">

  <div>
    <div class="d-flex justify-content-between align-items-end mb-1">
      <label class="form-label text-muted fw-bold mb-0">Reactant 1</label>
      <button class="btn-sm btn-link text-decoration-none text-muted p-0 substructure-btn" (click)="toggleMode(1)">
        <i class="bi" [ngClass]="showSub1 ? 'bi-arrow-return-left' : 'bi-diagram-3'"></i>
        {{ showSub1 ? 'Switch to Exact Match' : 'Search by Substructure' }}
      </button>
    </div>

    @if (!showSub1) {
      <app-reactant-selector
        label=""
        [availableReactants]="availableReactants"
        [initialValue]="initVal1"
        [clearSignal]="triggerClearValue1"
        (selectionChanged)="onReactantChange(1, $event)">
      </app-reactant-selector>
    } @else {
      <div class="p-3 bg-light border rounded shadow-sm">
        <app-substructure-search
          [availableReactants]="availableReactants"
          (matchedReactants)="onSubstructureMatch(1, $event)">
        </app-substructure-search>
      </div>
    }
  </div>

  <div>
    <div class="d-flex justify-content-between align-items-end mb-1">
      <label class="form-label text-muted fw-bold mb-0">Reactant 2</label>
      <button class="btn-sm btn-link text-decoration-none text-muted p-0 substructure-btn" (click)="toggleMode(2)">
        <i class="bi" [ngClass]="showSub2 ? 'bi-arrow-return-left' : 'bi-diagram-3'"></i>
        {{ showSub2 ? 'Switch to Exact Match' : 'Search by Substructure' }}
      </button>
    </div>

    @if (!showSub2) {
      <app-reactant-selector
        label=""
        [availableReactants]="availableReactants"
        [initialValue]="initVal2"
        [clearSignal]="triggerClearValue2"
        (selectionChanged)="onReactantChange(2, $event)">
      </app-reactant-selector>
    } @else {
      <div class="p-3 bg-light border rounded shadow-sm">
        <app-substructure-search
          [availableReactants]="availableReactants"
          (matchedReactants)="onSubstructureMatch(2, $event)">
        </app-substructure-search>
      </div>
    }
  </div>

</div>
