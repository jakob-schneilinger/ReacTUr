
<div class="layout-wrapper">
  <app-layout>

    <!-- Linke Spalte -->
    <div leftContent>
      <h2>Search</h2>
      <app-experiment-search
        [triggerClear]="clearSignal"
        [reactantA]="reactantA"
        [reactantB]="reactantB"
        (searchChanged)="handleSearch($event)">
      </app-experiment-search>

      <div class="divider"></div>

      <div class="collapse-toggle-container">
        <div class="collapse-toggle" (click)="toggleAdvancedSearch()">
          <span>Advanced Search</span>
          <i class="bi" [ngClass]="isAdvancedSearchOpen ? 'bi-chevron-up' : 'bi-chevron-down'"></i>
        </div>
      </div>

      <app-advanced-search
        class="advanced-search-content"
        [hidden]="!isAdvancedSearchOpen"
        [reactantA]="reactantA"
        [reactantB]="reactantB"
        [triggerClear]="clearSignal"
        (searchChanged)="handleAdvancedSearch($event)">
      </app-advanced-search>

      <!-- TODO: currently hidden, look if search without button is feasible -->
      <button class="primary" (click)="handleSearchButton()" [hidden]="true">
        Search for Experiments
      </button>

      <button class="" (click)="onClearClicked()">
        Clear Fields
      </button>

      <button class="primary"
              [routerLink]="['/experiments/create']"
              [queryParams]="{
          reactantA: reactantA.length ? reactantA : null,
          reactantB: reactantB.length ? reactantB : null
        }">
        Create new Experiment
      </button>
    </div>

    <!-- Rechte Spalte -->
    <div rightContent>
      <app-experiment-results
        [state]="currentSearchState"
        [experiments]="foundExperiments"
        (getExport)="handleExport($event)">
      </app-experiment-results>
    </div>
  </app-layout>
  @if (isExportModalOpen) {
    <app-export-modal
      [selectedExperiments]="experimentsToExport"
      (close)="isExportModalOpen = false">
    </app-export-modal>
  }
</div>
