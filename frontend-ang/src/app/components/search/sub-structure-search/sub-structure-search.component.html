<div class="substructure-query-builder d-flex flex-column gap-2">

  <ng-template #groupTemplate let-group="group" let-isRoot="isRoot">
    <div class="p-3 rounded" [ngClass]="isRoot ? 'bg-white' : 'bg-light border ms-4 mt-2'">

      <div class="d-flex align-items-center gap-2 mb-3 pb-2 border-bottom">
        @if (!isRoot) {
          <span class="badge bg-secondary">Group ( )</span>
        }

        <select class="form-select form-select-sm fw-bold text-primary" style="width: auto;" [(ngModel)]="group.operator">
          <option value="AND">AND</option>
          <option value="OR">OR</option>
        </select>

        <div class="form-check form-switch ms-2 mb-0 d-flex align-items-center gap-2">
          <input class="form-check-input mt-0" type="checkbox" role="switch" [(ngModel)]="group.isNot" [id]="'notSwitch' + group.id">
          <label class="form-check-label fw-bold text-secondary" [for]="'notSwitch' + group.id">NOT</label>
        </div>

        @if (!isRoot) {
          <button class="btn btn-sm btn-link text-danger ms-auto p-0" (click)="removeNode(group.id)" title="Remove Group">
            <i class="bi bi-trash"></i>Group
          </button>
        }
      </div>

      <div class="d-flex flex-column gap-2">
        @for (child of group.children; track child.id) {

          @if (child.type === 'GROUP') {
            <ng-container *ngTemplateOutlet="groupTemplate; context:{ group: child, isRoot: false }"></ng-container>
          } @else {
            <div class="d-flex align-items-center gap-2">
              <div class="input-group shadow-sm border-0 rounded">

                <div class="input-group-text bg-white border-end-0">
                  <div class="form-check mb-0">
                    <input class="form-check-input" type="checkbox" [(ngModel)]="child.isNot" [id]="'ruleNot' + child.id">
                    <label class="form-check-label fw-bold text-secondary ms-1" [for]="'ruleNot' + child.id">NOT</label>
                  </div>
                </div>

                <input
                  type="text"
                  class="form-control border-start-0 font-monospace"
                  placeholder="Draw or paste SMILES..."
                  [(ngModel)]="child.smiles">

                <button class="btn btn-outline-secondary bg-white substructure-btn" type="button" (click)="openDraw(child)" title="Draw Substructure">
                  <i class="bi bi-pencil-square"></i>
                </button>
              </div>

              <button class="btn btn-link text-danger p-0 ms-1 remove-condition-btn"
                      (click)="removeNode(child.id)"
                      [disabled]="isRoot && group.children.length === 1">
                <i class="bi bi-trash"></i>
              </button>
            </div>
          }
        }

        <div class="mt-2 d-flex gap-2">
          <button class="btn btn-sm btn-outline-primary" (click)="addRule(group)">
            <i class="bi bi-plus-lg"></i> Add Rule
          </button>
          <button class="btn btn-sm btn-outline-secondary" (click)="addGroup(group)">
            <i class="bi bi-folder-plus"></i> Add Group ( )
          </button>
        </div>
      </div>
    </div>
  </ng-template>

  <ng-container *ngTemplateOutlet="groupTemplate; context:{ group: rootGroup, isRoot: true }"></ng-container>

  <div class="d-flex justify-content-end mt-3 pt-3 border-top">
    <button class="btn btn-primary" (click)="onSearchSubmit()">
      <i class="bi bi-search me-1"></i> Search Substructures
    </button>
  </div>
</div>

@if (isDrawModalOpen) {
  <app-draw-mol
    [initialSmiles]="currentSmilesForModal"
    (save)="onModalSave($event)"
    (closeModal)="isDrawModalOpen = false">
  </app-draw-mol>
}
