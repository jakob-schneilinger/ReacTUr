<div class="modal fade show custom-backdrop" tabindex="-1" style="display: block;" aria-modal="true" role="dialog">
  <div class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">
          Export {{ selectedExperiments.length }} Experiment{{ selectedExperiments.length > 1 ? 's' : '' }}
        </h5>
        <button type="button" class="btn-close" (click)="close.emit()" aria-label="Close"></button>
      </div>

      <div class="modal-body p-0">
        <div class="row g-0 h-100">

          <div class="col-md-4 p-4 border-end settings-panel">
            <h6 class="fw-bold mb-3">Format</h6>
            <div class="btn-group w-100 mb-4" role="group">
              <input type="radio" class="btn-check" name="btnradio" id="btnradio1"
                     [checked]="exportFormat === 'json'" (change)="toggleFormat('json')">
              <label class="btn btn-outline-primary" for="btnradio1">JSON</label>

              <input type="radio" class="btn-check" name="btnradio" id="btnradio2"
                     [checked]="exportFormat === 'csv'" (change)="toggleFormat('csv')">
              <label class="btn btn-outline-primary" for="btnradio2">CSV</label>
            </div>

            <h6 class="fw-bold mb-3">Include Fields</h6>

            <div class="field-group mb-3">
              <label class="text-muted small text-uppercase mb-2">Core Parameters</label>
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="f_reactants" [(ngModel)]="exportFields.core.reactants" (change)="onFieldChange()">
                <label class="form-check-label" for="f_reactants">Reactants</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="f_date" [(ngModel)]="exportFields.core.date" (change)="onFieldChange()">
                <label class="form-check-label" for="f_date">Date</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="f_sci" [(ngModel)]="exportFields.core.scientist" (change)="onFieldChange()">
                <label class="form-check-label" for="f_sci">Scientist</label>
              </div>
            </div>

            <div class="field-group">
              <label class="text-muted small text-uppercase mb-2">Additional Info</label>
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="f_inst" [(ngModel)]="exportFields.additional.instrument" (change)="onFieldChange()">
                <label class="form-check-label" for="f_inst">Instrument</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="f_mod" [(ngModel)]="exportFields.additional.modality" (change)="onFieldChange()">
                <label class="form-check-label" for="f_mod">Modality</label>
              </div>
            </div>
          </div>

          <div class="col-md-8 p-0 bg-light d-flex flex-column preview-panel">
            <div class="p-3 border-bottom d-flex justify-content-between align-items-center bg-white">
              <span class="fw-bold text-secondary">Data Preview</span>
              <span class="badge bg-secondary">Showing first {{ selectedExperiments.length > 10 ? 10 : selectedExperiments.length }} items</span>
            </div>

            <div class="flex-grow-1 p-3 overflow-auto">
              <pre class="bg-dark text-light p-3 rounded code-preview"><code>{{ previewData }}</code></pre>
            </div>
          </div>

        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="close.emit()">Cancel</button>
        <button type="button" class="btn btn-primary" (click)="downloadFile()">
          <i class="bi bi-download me-2"></i> Download {{ exportFormat | uppercase }}
        </button>
      </div>

    </div>
  </div>
</div>
