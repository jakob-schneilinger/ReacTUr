
<div class="layout-wrapper">
  <app-layout>

    <!-- Linke Spalte -->
    <div leftContent>
      <h2>{{experimentTitle}}</h2>
      <app-experiment-details-form class="experiment-details-form" [formState]="formState">

      </app-experiment-details-form>
    </div>

    <!-- Rechte Spalte -->
    <div rightContent>
      <app-file-upload
        [allowedExtensions]="['txt', 'csv', 'dsx']"
        [maxFileSizeMB]="5">
      </app-file-upload>
    </div>

  </app-layout>
</div>
