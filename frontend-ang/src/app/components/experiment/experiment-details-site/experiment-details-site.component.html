
<div class="layout-wrapper">
  <app-layout>

    <!-- Linke Spalte -->
    <div leftContent>
      <h2>{{experimentTitle}}</h2>

      @if (formState === 'create' || experiment) {
        <app-experiment-details-form
          class="experiment-details-form"
          [formState]="formState"
          [experiment]="experiment">
        </app-experiment-details-form>
      } @else {
        <div class="loading-state">
          <p>Loading experiment details...</p>
        </div>
      }
    </div>

    <!-- Rechte Spalte -->
    <div rightContent>
      <app-file-upload
        [allowedExtensions]="['txt', 'csv', 'dsx']"
        [maxFileSizeMB]="20">
      </app-file-upload>
    </div>

  </app-layout>
</div>
