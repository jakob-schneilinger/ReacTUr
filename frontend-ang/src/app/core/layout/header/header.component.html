<div id="navbar">

  <div id="items">
    <div class="layout"></div>
    <div class="navitem logo" routerLink="/search">
      <div class="shadow-container">
        <div class="img-shadow"></div>
      </div>
      <img [alt]="'header.logoAlt' | transloco" ngSrc="images/enzyme.png" width="50" height="50" priority>
      <span>{{ 'header.title' | transloco }}</span>
    </div>
    <div class="navitem" routerLink="/search" routerLinkActive="active-link">{{ 'header.search' | transloco }}</div>
    <div class="navitem" routerLink="/experiments/create" routerLinkActive="active-link">{{ 'header.createExperiment' | transloco }}</div>
    <!--
    <div class="navitem"
         ngbDropdown
         display="static"
         placement="bottom"
         #experimentsDrop="ngbDropdown"
         (mouseenter)="experimentsDrop.open()"
         (mouseleave)="experimentsDrop.close()"
         routerLinkActive="active-link">

      <div ngbDropdownToggle
           routerLink="/experiments"
           class="dropdown-toggle-custom">
        Experiments
      </div>

      <div ngbDropdownMenu class="experiments-menu-wrapper">
        <div class="experiments-menu-content">
          <button ngbDropdownItem routerLink="/experiments/create">
            <i class="bi bi-plus-circle me-2"></i> Create Experiment
          </button>
        </div>
      </div>
    </div>
    -->
    <div class="navitem" routerLink="/reactants" routerLinkActive="active-link">{{ 'header.reactants' | transloco }}</div>
    <div class="navitem" routerLink="/admin" routerLinkActive="active-link" *appHasRole="['ADMIN']">{{ 'header.admin' | transloco }}</div>
  </div>

  <div class="profile-container">
    <div ngbDropdown placement="bottom-end" class="d-inline-block">
      <div id="profile" ngbDropdownToggle [title]="'header.userProfile' | transloco" class="bi bi-person"></div>

      <div ngbDropdownMenu>
        @if (isLoggedIn) {
          <button ngbDropdownItem disabled>{{'header.greetings' | transloco}}, {{ user?.firstName }}</button>
          <div class="dropdown-divider"></div>
          <button ngbDropdownItem (click)="logout()" class="text-danger logout-button">
            {{ 'header.logout' | transloco }}
            <i id="logout_icon" [title]="'header.logout' | transloco" class="bi bi-box-arrow-right"></i>
          </button>
        } @else {
          <button ngbDropdownItem routerLink="/login">
            {{ 'header.login' | transloco }}
            <i id="login_icon" [title]="'header.login' | transloco" class="bi bi-box-arrow-right"></i>
          </button>
        }
      </div>
    </div>
    <div class="layout"></div>
  </div>
</div>
