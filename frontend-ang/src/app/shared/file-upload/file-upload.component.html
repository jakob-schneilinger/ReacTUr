
<div class="container mt-4" style="max-width: 500px;" *transloco="let t; read: 'shared.upload'">

  @if (showTable) {
    <app-paste-table (fileGenerated)="onPasteTableGenerated($event)"></app-paste-table>
  }

  <app-drag-and-drop
    (filesSelected)="addFiles($event)"
    [allowedExtensions]="allowedExtensions"
    [maxFileSizeMB]="maxFileSizeMB"
    [maxFiles]="maxFiles" >
  </app-drag-and-drop>

  <div class="file-list mt-4">
    @for (file of files; track $index) {
      <app-uploaded-file
        [file]="file"
        (remove)="confirmRemoveFile($index)"
        [removePossible]="removePossible">
      </app-uploaded-file>
    }
  </div>
</div>

<app-confirm-modal
  [isOpen]="isDeleteFileModalOpen"
  [title]="'shared.upload.removeFile' | transloco"
  [message]="'shared.upload.removeConfirmMessage' | transloco:{ fileName: pendingFileName }"
  [confirmLabel]="'shared.upload.removeConfirmLabel' | transloco"
  confirmButtonClass="danger"
  (confirm)="executeDelete()"
  (cancel)="cancelDelete()">
</app-confirm-modal>
