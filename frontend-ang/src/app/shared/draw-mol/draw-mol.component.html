<app-modal
  [isOpen]="true"
  [title]="'search.modals.draw.title' | transloco"
  size="lg"
  (close)="onClose()">

  <div body class="text-center">
    <div class="sketcher-box border rounded bg-white mb-4 p-2 d-inline-block w-100"
         (pointerup)="onCanvasInteraction()"
         (keyup)="onCanvasInteraction()">
      <canvas [id]="canvasId"></canvas>
    </div>

    <div class="input-group shadow-sm">
      <span class="input-group-text bg-white fw-bold text-primary border-end-0">SMILES</span>
      <input
        type="text"
        class="form-control border-start-0 ps-0 shadow-none"
        [(ngModel)]="smilesString"
        (ngModelChange)="onSmileInput($event)"
        placeholder="e.g. C=CCC"
      />
    </div>
  </div>

  <ng-container footer>
    <button type="button" class="text-white px-4" (click)="onClose()">{{ 'shared.actions.cancel' | transloco }}</button>
    <button type="button" class="primary px-4" (click)="onSave()">
      <i class="bi bi-check2 me-2"></i> {{ 'search.modals.draw.apply' | transloco }}
    </button>
  </ng-container>
</app-modal>
