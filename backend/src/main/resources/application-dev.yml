spring:
  docker:
    compose:
      enabled: false
  datasource:
    url: jdbc:postgresql://${DB_HOST}:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/test

seaweedfs:
  s3:
    endpoint: ${SEAWEEDFS_ENDPOINT:http://localhost:8333}
    access-key: ${SEAWEEDFS_ACCESS_KEY}
    secret-key: ${SEAWEEDFS_SECRET_KEY}
    bucket: ${SEAWEEDFS_BUCKET:experiment-files}

logging:
  level:
    org.springframework.web.servlet.DispatcherServlet: DEBUG

